steps:
  # ==========================================
  # Step 1: Backend Tests
  # ==========================================
  - name: 'gradle:8-jdk21'
    dir: 'backend'
    entrypoint: 'gradle'
    args: ['test', '--no-daemon']

  # ==========================================
  # Step 2: Build & Push Backend Docker Image
  # ==========================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/snipli/api:$COMMIT_SHA'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/snipli/api:$COMMIT_SHA'

  # ==========================================
  # Step 3: Build & Push Frontend Docker Image
  # ==========================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/snipli/ui:$COMMIT_SHA'
      - './frontend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/snipli/ui:$COMMIT_SHA'

  # ==========================================
  # Step 4: Deploy Backend to Cloud Run
  # ==========================================
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'snipli-api'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/snipli/api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # ==========================================
  # Step 5: Deploy Frontend to Cloud Run
  # ==========================================
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'snipli-ui'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/snipli/ui:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/snipli/api:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/snipli/ui:$COMMIT_SHA'
