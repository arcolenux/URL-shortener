# ──────────────────────────────────────────────
# Docker Compose — Local Development Topology
# Starts Firestore emulator, Redis, Backend & Frontend
# ──────────────────────────────────────────────
version: '3.9'

services:
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    command: >
      gcloud emulators firestore start
      --host-port=0.0.0.0:8081
      --project=snipli-local
    ports:
      - "8081:8081"
    environment:
      - FIRESTORE_EMULATOR_HOST=0.0.0.0:8081

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8081
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GCP_PROJECT_ID=snipli-local
      - SNIPLI_API_KEY=snipli-dev-secret-key-12345
      - SNIPLI_BASE_URL=http://localhost:8080
      - SNIPLI_TASKS_HANDLER_URL=http://backend:8080/internal/tasks/record-click
    depends_on:
      - firestore-emulator
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_API_KEY=snipli-dev-secret-key-12345
    depends_on:
      - backend

volumes:
  redis-data:
